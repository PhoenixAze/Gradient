<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sınaq Zalı | Gradient</title>
  
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!--
    Zero-Trust CSP: 'unsafe-inline' YOXDUR — bütün stiller xarici CSS fayllarındadır.
    blob:/data: yalnız PDF sənədinin iframe-də göstərilməsi üçün məhduddur.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://gradient-backend-fam5.onrender.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src 'self' blob: data: https://*.supabase.co https://gradient-backend-fam5.onrender.com; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/exam-hall.css">

  <script src="js/main.js" defer></script>
  <script src="js/exam-hall.js" defer></script>
</head>
<body class="exam-body">

  <a class="skip-link" href="#exam-main-container">Əsas məzmuna keç</a>

  <!-- Üst Panel (Header) -->
  <header class="exam-header">
    <div class="exam-header-left">
      <div id="title-skeleton" class="skeleton skeleton-text title-skeleton"></div>
      <div class="exam-header-titles">
        <h1 id="exam-title" class="exam-title hidden"></h1>
        <span id="exam-type-badge" class="badge exam-type-badge hidden"></span>
      </div>
    </div>
    <div class="exam-header-right">
      <div class="timer-box" id="timer-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span id="timer-display" role="timer" aria-label="Qalan vaxt">--:--</span>
      </div>
      <button id="btn-finish-exam" type="button" class="btn btn-danger" disabled>Sınağı Bitir</button>
    </div>
  </header>

  <!-- Əsas Məzmun -->
  <main class="exam-main" id="exam-main-container">
    
    <!-- FORMAT 1: İNTERAKTİV TESTLƏR GÖRÜNÜŞÜ (Platforma Sınaqları) -->
    <div id="standard-exam-view" class="standard-exam-view">
      <!-- Sol Tərəf: Sual Paneli -->
      <div class="question-container">
        <!-- Skeleton Loader (.clinerules §4) -->
        <div id="question-skeleton" class="skeleton-stack">
          <div class="skeleton skeleton-text sk-q-title"></div>
          <div class="skeleton sk-q-option"></div>
          <div class="skeleton sk-q-option"></div>
          <div class="skeleton sk-q-option"></div>
          <div class="skeleton sk-q-option"></div>
        </div>

        <!-- Real Sual Məzmunu -->
        <div id="question-content" class="hidden">
          <div class="question-header">
            <span class="question-number" id="q-number">Sual 1</span>
          </div>
          <p class="question-text" id="q-text"></p>
          
          <div class="options-list" id="options-container" role="radiogroup" aria-labelledby="q-text">
            <!-- JS ilə bura radio buttonlar gələcək -->
          </div>
        </div>

        <!-- Naviqasiya Düymələri -->
        <div class="question-nav">
          <button id="btn-prev" type="button" class="btn btn-outline" disabled>Əvvəlki</button>
          <button id="btn-next" type="button" class="btn btn-accent" disabled>Növbəti</button>
        </div>
      </div>

      <!-- Sağ Tərəf: Suallar Palitrası -->
      <aside class="palette-container">
        <h3 class="palette-title">Suallar</h3>
        <div class="palette-grid" id="palette-grid">
          <!-- JS ilə bura sual nömrələri gələcək -->
        </div>
        <div class="palette-legend">
          <div class="legend-item"><span class="legend-box answered"></span> Cavablandırılıb</div>
          <div class="legend-item"><span class="legend-box current"></span> Hazırkı</div>
          <div class="legend-item"><span class="legend-box unanswered"></span> Boş</div>
        </div>
      </aside>
    </div>

    <!-- FORMAT 2: PDF SINAQ VƏ RƏQƏMSAL CAVAB KARTI GÖRÜNÜŞÜ (Repetitor Sınaqları) -->
    <div id="pdf-exam-view" class="pdf-exam-view hidden">
      <!-- Mobil Switcher (900px altında PDF və ya Cavab kartı) -->
      <div class="mobile-view-tabs" id="pdf-mobile-tabs" role="tablist" aria-label="Sənəd görünüşü">
        <button type="button" class="mobile-view-tab active" id="tab-show-pdf" role="tab" aria-selected="true" aria-controls="pdf-viewer-section">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          Sınaq PDF-i
        </button>
        <button type="button" class="mobile-view-tab" id="tab-show-sheet" role="tab" aria-selected="false" aria-controls="answer-sheet-section">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="8" y1="9", x2="16" y2="9"></line><line x1="8" y1="14" x2="16" y2="14"></line></svg>
          Cavab Kartı
        </button>
      </div>

      <div class="pdf-exam-container">
        <!-- Sol Tərəf: PDF Viewer -->
        <section class="pdf-viewer-section" id="pdf-viewer-section">
          <div class="pdf-viewer-header">
            <span id="pdf-viewer-title">Sınaq PDF Sənədi</span>
            <div class="pdf-viewer-actions">
              <button type="button" id="btn-pdf-fullscreen" class="btn btn-ghost btn-sm btn-xs">Tam Ekran</button>
            </div>
          </div>
          <iframe id="pdf-viewer-frame" class="pdf-viewer-frame" title="PDF Sınaq Sənədi" src="about:blank"></iframe>
        </section>

        <!-- Sağ Tərəf: Rəqəmsal DİM Cavab Kartı -->
        <section class="answer-sheet-section mobile-hidden" id="answer-sheet-section">
          <div class="answer-sheet-header">
            <div class="answer-sheet-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
              <span>Rəqəmsal Cavab Kartı</span>
            </div>
            <div class="answer-sheet-sub" id="answer-sheet-sub">
              DİM Standartı ilə sualların doğru variantlarını qeyd edin.
            </div>
            <div class="answer-sheet-progress-bar-wrap">
              <div class="answer-sheet-progress-bar" id="answer-sheet-progress-bar"></div>
            </div>
          </div>

          <div class="optical-sheet-scroll">
            <div class="optical-rows-grid" id="pdf-optical-sheet">
              <!-- JS ilə 1-dən N-ə qədər optik dairələr doldurulacaq -->
            </div>
          </div>

          <div class="answer-sheet-footer">
            <span class="answer-sheet-counter" id="pdf-counter-display">
              0 / 25 cavablandırılıb
            </span>
            <button type="button" id="btn-submit-pdf-exam" class="btn btn-danger btn-sm">Sınağı Təhvil Ver</button>
          </div>
        </section>
      </div>
    </div>

  </main>

  <!-- Qlobal Xəta/Məlumat Modalı -->
  <div id="exam-overlay" class="overlay hidden" aria-hidden="true">
    <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
      <h2 id="modal-title">Diqqət</h2>
      <p id="modal-message">Məlumat yüklənir...</p>
      <div class="modal-actions">
        <button id="btn-modal-close" type="button" class="btn btn-outline hidden">Geri qayıt</button>
        <button id="btn-modal-confirm" type="button" class="btn btn-accent hidden">Təsdiqlə</button>
      </div>
    </div>
  </div>

</body>
</html>
